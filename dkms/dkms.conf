# DKMS configuration for the out-of-tree virtio_bt driver.
#
# SPDX-License-Identifier: GPL-2.0-or-later
#
# The virtio_bt.c source is the unmodified upstream Linux driver, staged
# by stage.sh from a kernel source matching the target kernel. DKMS builds
# it against the installed kernel headers and installs it under
# /lib/modules/<ver>/updates/dkms/, so it overrides any (absent) in-tree
# copy.

PACKAGE_NAME="virtio-bt"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="virtio_bt"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Rebuild automatically on kernel upgrades. If a future kernel changes the
# Bluetooth/virtio API and the build fails, re-run stage.sh to refresh the
# source from that kernel's tree (see README.md).
AUTOINSTALL="yes"
